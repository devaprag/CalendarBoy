<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendar Boy</title>
<link rel="stylesheet" href="styles.css?v=3.3">
</head>
<body class="locked">

<header>
  <div class="brand"><span id="brand-icon"></span><span>Calendar Boy</span></div>
  <button class="btn" data-action="go-today" title="Jump to today's month">Today</button>
  <button class="nav-btn" data-action="prev-month" aria-label="Previous month">&#8249;</button>
  <button class="nav-btn" data-action="next-month" aria-label="Next month">&#8250;</button>
  <h1 id="month-title"></h1>
  <span class="spacer"></span>
  <label class="today-pick" title="Pretend today, so the demo months have a past and a future">Today is
    <input type="date" id="today-input">
  </label>
  <button class="toggle" id="filter-btn" data-action="toggle-filter" aria-pressed="false" title="Hide past events that weren't done">&#10003; Show done</button>
  <details class="menu">
    <summary>Data</summary>
    <div class="menu-list">
      <button data-action="real-today">Use the real date as today</button>
      <button data-action="export">Export JSON</button>
      <button data-action="import">Import JSON&hellip;</button>
      <button data-action="reset">Reset demo data</button>
      <p class="menu-version" id="app-version">Old app.js still cached: reopen the page</p>
    </div>
  </details>
  <input type="file" id="import-file" accept=".json,application/json" hidden>
</header>

<div class="app">
  <aside>
    <div class="side-head"><h2>Event types</h2><button class="btn small" data-action="add-type">+ Add</button></div>
    <p class="hint" id="types-month"></p>
    <ul class="types" id="types"></ul>
    <p class="hint">Tap an icon to cycle To do &rarr; Done &rarr; Abandoned. Long-press (or right-click) for details.</p>
  </aside>
  <main>
    <div class="shelf">
      <button class="lock-btn" id="lock-btn" data-action="toggle-lock"></button>
      <div class="shelf-group">
        <span class="shelf-label">Add</span>
        <div class="palette" id="palette"></div>
      </div>
      <div class="shelf-group backlog-group">
        <span class="shelf-label">Backlog</span>
        <div class="backlog" id="backlog" data-drop="backlog"></div>
      </div>
    </div>
    <div class="dow"><div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div></div>
    <div class="weeks-wrap"><div class="weeks" id="weeks"></div></div>
  </main>
</div>

<button class="bin" id="bin" data-drop="bin" data-action="open-bin" aria-label="Recycling bin" title="Recycling bin">
  <span id="bin-icon"></span><span class="badge" id="bin-badge" hidden></span>
</button>

<div class="popover" id="popover" hidden role="dialog" aria-modal="false">
  <button class="close" data-action="close-popover" aria-label="Close">&times;</button>
  <div id="pop-body"></div>
</div>

<dialog id="type-dialog"><form id="type-form"></form></dialog>

<!-- Plain scripts, not modules: modules and fetch() are blocked on file:// -->
<script src="icons.js?v=3.3"></script>
<script src="data.js?v=3.3"></script>
<script src="app.js?v=3.3"></script>
</body>
</html>
