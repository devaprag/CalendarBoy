<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendar Boy</title>
<link rel="stylesheet" href="styles.css?v=4.10">
</head>
<body class="locked">

<div class="topbar">
<header>
  <div class="brand"><span id="brand-icon"></span><span>Calendar Boy</span></div>
  <button class="btn" data-action="go-today" title="Jump to today's month">Today</button>
  <button class="nav-btn" data-action="prev-month" aria-label="Previous month">&#8249;</button>
  <button class="nav-btn" data-action="next-month" aria-label="Next month">&#8250;</button>
  <h1 id="month-title"></h1>
  <span class="spacer"></span>
  <label class="today-pick" title="Pretend today, so the demo months have a past and a future">Today is
    <input type="date" id="today-input">
  </label>
  <button class="toggle" id="filter-btn" data-action="toggle-filter" aria-pressed="false" title="Show only events that are done">&#10003; Show done</button>
  <details class="menu">
    <summary>Data <span class="sync-badge" id="sync-badge"></span></summary>
    <div class="menu-list">
      <div id="sync-menu"></div>
      <button data-action="real-today">Use the real date as today</button>
      <button data-action="start-fresh">Start fresh (empty calendar)</button>
      <button data-action="export">Export JSON</button>
      <button data-action="import">Import JSON&hellip;</button>
      <button data-action="import-strava">Import Strava runs (activities.csv)&hellip;</button>
      <button data-action="reset">Reset demo data</button>
      <p class="menu-version" id="app-version">Old app.js still cached: reopen the page</p>
    </div>
  </details>
  <input type="file" id="import-file" accept=".json,application/json" hidden>
  <input type="file" id="strava-file" accept=".csv,text/csv" hidden>
</header>
  <div class="shelf" id="shelf">
    <button class="lock-btn" id="lock-btn" data-action="toggle-lock"></button>
    <button class="add-type-btn" id="add-type-btn" data-action="add-type" aria-label="New event type" title="New event type"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5 V19 M5 12 H19" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg><span>New type</span></button>
    <div class="shelf-group">
      <span class="shelf-label add-label">Add</span>
      <div class="palette" id="palette"></div>
    </div>
    <div class="shelf-group backlog-group">
      <span class="shelf-label">Backlog</span>
      <div class="backlog" id="backlog" data-drop="backlog"></div>
    </div>
    <button class="shelf-toggle" id="shelf-toggle" data-action="toggle-shelf" aria-controls="shelf"></button>
  </div>
</div>

<div class="app">
  <aside id="side">
    <div class="side-head">
      <!-- The heading collapses the panel on phones; on desktop it's just a heading. -->
      <button class="side-toggle" id="side-toggle" data-action="toggle-stats" aria-controls="side-body">
        <h2>Event types</h2><span class="chevron" aria-hidden="true">&#9662;</span>
      </button>
      <button class="btn small tracker-btn" data-action="open-year" title="A year of each habit at a glance"><span id="tracker-icon"></span>Tracker</button>
    </div>
    <div id="side-body">
      <p class="hint" id="types-month"></p>
      <ul class="types" id="types"></ul>
      <p class="hint">Tap an icon to cycle To do &rarr; Done &rarr; Abandoned. Long-press (or right-click) for details.</p>
    </div>
  </aside>
  <main>
    <div class="dow"><div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div></div>
    <div class="weeks-wrap"><div class="weeks" id="weeks"></div></div>
  </main>
</div>

<button class="bin" id="bin" data-drop="bin" data-action="open-bin" aria-label="Recycling bin" title="Recycling bin">
  <span id="bin-icon"></span><span class="badge" id="bin-badge" hidden></span>
</button>

<div class="popover" id="popover" hidden role="dialog" aria-modal="false">
  <button class="close" data-action="close-popover" aria-label="Close">&times;</button>
  <div id="pop-body"></div>
</div>

<div class="toast" id="toast" hidden role="status"><span id="toast-text"></span><button data-action="undo">Undo</button></div>

<dialog id="type-dialog"><form id="type-form"></form></dialog>
<dialog id="year-dialog" class="year-dialog"></dialog>

<!-- Plain scripts, not modules: modules and fetch() are blocked on file:// -->
<script src="icons.js?v=4.10"></script>
<script src="data.js?v=4.10"></script>
<script src="firebase-config.js?v=4.10"></script>
<script src="../strava-lib/strava-export.js?v=1"></script>
<script src="app.js?v=4.10"></script>
<script src="sync.js?v=4.10"></script>
</body>
</html>
